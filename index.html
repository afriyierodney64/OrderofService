<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF Viewer — splt_organized.pdf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pdf-app">
    <!-- Top Header Toolbar -->
    <header class="app-header">
      <div class="header-left">
        <button class="icon-btn active" id="btnToggleSidebar" title="Toggle Thumbnails">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <div class="doc-title-group" title="splt_organized.pdf">
          <span class="pdf-badge">PDF</span>
          <span class="desktop-tablet-only">splt_organized.pdf</span>
        </div>
      </div>

      <!-- Center Page Nav -->
      <div class="header-center">
        <button class="icon-btn desktop-tablet-only" id="btnPrevHeader" title="Previous Page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>

        <div class="page-pill">
          <input type="number" id="pageInput" min="1" max="14" value="1" aria-label="Page number">
          <span class="pill-divider">/</span>
          <span id="totalPagesText">14</span>
        </div>

        <button class="icon-btn desktop-tablet-only" id="btnNextHeader" title="Next Page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <!-- Right Tools -->
      <div class="header-right">
        <!-- Fit Width (Expanded Default) & Fit Screen Toggle -->
        <button class="action-btn desktop-tablet-only active" id="btnFitWidth" title="Expand to Fit Width (Default)">
          <span>Fit Width</span>
        </button>

        <button class="action-btn desktop-tablet-only" id="btnFitScreen" title="Fit Entire Page to Screen Height">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="8 3 4 3 4 7"/>
            <polyline points="4 17 4 21 8 21"/>
            <polyline points="16 3 20 3 20 7"/>
            <polyline points="20 17 20 21 16 21"/>
          </svg>
          <span>Fit Screen</span>
        </button>

        <div class="separator desktop-only"></div>

        <!-- Print (Desktop only) -->
        <button class="icon-btn desktop-only" id="btnPrint" title="Print Document">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
        </button>

        <!-- Download PDF -->
        <a href="splt_organized.pdf" download="splt_organized.pdf" class="action-btn download-btn" title="Download original PDF">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="desktop-tablet-only">Download</span>
        </a>

        <!-- Fullscreen (Desktop only) -->
        <button class="icon-btn desktop-only" id="btnFullscreen" title="Fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="main-layout">
      <!-- Thumbnail Sidebar (Collapsible) -->
      <aside class="sidebar hidden" id="sidebar">
        <!-- Rendered via JS -->
      </aside>

      <!-- Scrollable Reader Area (Expands across screen by default) -->
      <main class="document-scroll-area" id="scrollArea">
        <div class="pages-stream" id="pagesStream">
          <!-- All 14 pages rendered via JS -->
        </div>
      </main>
    </div>

    <!-- Mobile Floating Navigation Bar -->
    <div class="mobile-nav-bar" id="mobileNavBar">
      <button id="btnMobilePrev" title="Previous Page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="mobile-page-indicator" id="mobilePageText">Page 1 / 14</div>

      <button id="btnMobileNext" title="Next Page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>

      <div class="separator" style="margin: 0 4px;"></div>

      <button id="btnMobileThumbnails" title="Toggle Thumbnails">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
